name: Deploy WiFi Girls Preview

on:
  push:
    branches:
      - design/mobile-feed-crayon-assets
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wifi-girls-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - name: Install dependencies
        working-directory: next-app
        run: npm ci
      - name: Build static Next.js site
        working-directory: next-app
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: next-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: wifi-girls-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
