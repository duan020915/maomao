name: Deploy WiFi Girls Preview

on:
  push:
    branches:
      - design/mobile-feed-crayon-assets
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wifi-girls-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Package complete Maomao app from repository root
        run: |
          mkdir -p site
          cp index.html ./*.css ./*.js ./*.svg ./*.webmanifest site/
          cp -R assets site/
          cp -R vendor site/
          touch site/.nojekyll
          test -s site/index.html
          test -s site/app.js
          test -s site/bubble-stickers.css
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: wifi-girls-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
